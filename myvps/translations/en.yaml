configuration:
  ssh_authorized_keys:
    name: SSH public keys
    description: Public keys allowed to sign in as vps. Never paste a private key here.
  packages:
    name: Extra Rocky packages
    description: Packages installed automatically when the app starts.
  app_enabled:
    name: Start the web app automatically
  app_directory:
    name: Project directory
    description: Select a project under /data/workspace. The default is the included Express example.
  app_command:
    name: Start command
    description: Leave empty to use a Procfile web entry or npm start. Examples include node server.js and dotnet YourApp.dll.
  app_port:
    name: Internal app port
    description: The backend port Nginx connects to. This does not publish another host port.
  network_protection:
    name: Home network protection
    description: Blocks new outgoing connections to home devices and other HA services. Website and SSH access still work.
    fields:
      enabled:
        name: Block access to local devices
        description: Keep enabled for public websites. Disabling this allows applications to connect to your home network.
      public_ipv4:
        name: Home public IPv4 address (optional)
        description: Leave empty to detect it automatically at startup. Set your actual public IPv4 address if automatic detection is unavailable. Restart after your public IP changes.
      blocked_ipv4_networks:
        name: Additional IPv4 networks to block
        description: Optional extra addresses or CIDR ranges. Private networks are already blocked. New outgoing IPv6 connections are always blocked when protection is enabled.
  tls:
    name: HTTPS certificates
    description: Automatic Let's Encrypt certificates for the selected web app. Every hostname must point to this server and be reachable on public port 80.
    fields:
      enabled:
        name: Enable automatic HTTPS
      domains:
        name: Domain names
        description: One hostname per entry, such as app.example.com and www.example.com. All names serve the selected app. The first names the certificate.
      domain:
        name: Legacy single hostname
        description: Compatibility setting for version 0.1. Prefer the Domain names list.
      email:
        name: Let's Encrypt account email
      staging:
        name: Use the staging CA
        description: Test issuance using untrusted certificates. Disable this to obtain a browser-trusted production certificate.
