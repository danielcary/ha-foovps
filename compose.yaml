services:
  myvps:
    build: ./myvps
    image: myvps:dev
    ports:
      - "127.0.0.1:8000:80"
      - "127.0.0.1:8443:443"
      - "127.0.0.1:2222:22"
    volumes:
      - workspace:/data
      - configuration:/config
    mem_limit: 1g
    cpus: 2
    restart: unless-stopped
    stop_grace_period: 60s

volumes:
  workspace:
  configuration:
